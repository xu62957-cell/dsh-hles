# HLES 安装行：配置项都可选，省略即用默认值。
- insert:
    - id: hles
      name: dsh-hles
      config:
        explore:
          enabled: true
          pagesPerCycle: 6
          maxPagesPerCycle: 20
          minHostIntervalMs: 2500
          timeoutMs: 20000
          maxBytes: 1572864
        schedule:
          enabled: true
          intervalMinutes: 360
        inject:
          enabled: true
          maxChars: 700
          minHits: 2
          defaultLang: zh
